name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            "0.0.0-dev"
          }
          $revision = $env:GITHUB_SHA
          Write-Output "Building for Windows..."
          go build -ldflags="-s -w -X main.version=$version -X main.revision=$revision"
          Write-Output "Building for Linux..."
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -ldflags="-s -w -X main.version=$version -X main.revision=$revision"
      - name: Create artifact
        shell: pwsh
        run: |
          Write-Output "Creating Windows artifact..."
          &"C:\Program Files\7-Zip\7z.exe" `
            a `
            -r `
            -tzip `
            -mx=9 `
            use-ssh-over-hyper-v-socket.zip `
            use-ssh-over-hyper-v-socket.exe
          Write-Output "Creating Linux artifact..."
          tar czf `
            use-ssh-over-hyper-v-socket.tgz `
            use-ssh-over-hyper-v-socket
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: use-ssh-over-hyper-v-socket
          path: |
            use-ssh-over-hyper-v-socket.zip
            use-ssh-over-hyper-v-socket.tgz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          artifacts: >-
            use-ssh-over-hyper-v-socket.zip,
            use-ssh-over-hyper-v-socket.tgz
          token: ${{ secrets.GITHUB_TOKEN }}
